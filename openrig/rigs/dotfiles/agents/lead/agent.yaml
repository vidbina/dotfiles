name: lead
version: "1.0"
description: The person's entry point; owns Linear issues and routes work to the team

defaults:
  runtime: claude-code

# OpenRig's shared base, linked into the user profile by the dotfiles package
# so the path survives version bumps (see README.org, OpenRig section).
imports:
  - ref: path:/etc/profiles/per-user/vidbina/share/openrig/specs/agents/shared

profiles:
  default:
    uses:
      skills: []
      guidance: []
      subagents: []
      plugins: [shared:openrig-core]
      runtime_resources: [shared:claude-default-settings, shared:claude-default-mcp, shared:claude-activity-hooks]

resources:
  guidance:
    - id: role
      path: guidance/role.md

startup:
  files:
    - path: guidance/role.md
      orientation: role
      delivery_hint: send_text
      required: true
  actions: []
