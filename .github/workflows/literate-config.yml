name: Literate Config

# Uses dorny/paths-filter instead of native on.paths so the validate job
# always appears on PRs — either running the check or reporting "skipped".
# This satisfies branch protection's required status checks regardless of
# which files changed. See AGENTS.md "CI workflows and branch protection".

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs for the same branch when a new push arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            literate:
              - '**/*.org'
              - 'flake.nix'
              - 'flake.lock'
              - 'Makefile'
              - '.github/workflows/**'

      - uses: cachix/install-nix-action@v31
        if: steps.filter.outputs.literate == 'true'

      - uses: nix-community/cache-nix-action@v6
        if: steps.filter.outputs.literate == 'true'
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-macos: 4000000000

      - name: Check config
        if: steps.filter.outputs.literate == 'true'
        run: nix develop --command make check-config

      - name: Skip (no literate config changes)
        if: steps.filter.outputs.literate != 'true'
        run: echo "No literate config files changed — skipping validation."
